name: Build Unsigned DEB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Locate and Heavy Patch Project
        run: |
          XCODEPROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ_PATH" ]; then
            echo "❌ Error: No .xcodeproj found in repository!"
            exit 1
          fi
          echo "PROJECT_PATH=$XCODEPROJ_PATH" >> $GITHUB_ENV
          
          SCHEME_NAME=$(xcodebuild -project "$XCODEPROJ_PATH" -list | sed -n '/Schemes:/,$p' | sed '1d' | tr -d ' ' | head -n 1)
          echo "SCHEME_NAME=$SCHEME_NAME" >> $GITHUB_ENV

          # 1. 彻底移除证书签名约束
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' "$XCODEPROJ_PATH/project.pbxproj" || true
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$XCODEPROJ_PATH/project.pbxproj" || true
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]\{10\}//g' "$XCODEPROJ_PATH/project.pbxproj" || true
          sed -i '' '/CODE_SIGN_ENTITLEMENTS/d' "$XCODEPROJ_PATH/project.pbxproj" || true
          find . -name "*.entitlements" -exec rm -f {} \; || true
          
          # 2. 强行卡死设备为物理真机
          sed -i '' 's/TARGETED_DEVICE_FAMILY = .*/TARGETED_DEVICE_FAMILY = "1,2";/g' "$XCODEPROJ_PATH/project.pbxproj" || true
          
          # 3. 覆盖通用测试 Bundle ID
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.test.guidedcapture;/g' "$XCODEPROJ_PATH/project.pbxproj" || true

          # 4. 彻底切断 Asset 模拟器校验报错 bug
          sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME = .*/ASSETCATALOG_COMPILER_APPICON_NAME = "";/g' "$XCODEPROJ_PATH/project.pbxproj" || true
          rm -rf $(find . -name "Assets.xcassets") || true

          echo "Project patched successfully."
          
      - name: Build Code Only
        run: |
          xcodebuild build \
            -project "${{ env.PROJECT_PATH }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS="arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO

      - name: Manual Package to Standard Jailbreak DEB
        run: |
          # 1. 寻找之前顺利通过编译的 .app 真实路径
          BUILT_APP_DIR=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          if [ -z "$BUILT_APP_DIR" ]; then
            echo "❌ Error: Could not find compiled app binary!"
            exit 1
          fi

          # 2. 建立标准的越狱应用 deb 安装目录结构 (必须全部放到 /Applications 目录下)
          mkdir -p deb_working/Applications
          cp -r "$BUILT_APP_DIR" deb_working/Applications/
          
          # 3. 创建标准控制元数据文件
          mkdir -p deb_working/DEBIAN
          printf "Package: com.test.guidedcapture\nName: GuidedCaptureSample\nVersion: 1.0.0\nArchitecture: iphoneos-arm\nDescription: Object Capture scanning sample app natively packaged into deb.\nMaintainer: GitHubActions\nAuthor: Apple\nSection: Applications\n" > deb_working/DEBIAN/control

          # 4. 🔥 针对 macOS 的原生打包魔改：用 tar 手动压制 control 和 data 切片
          mkdir -p output_deb
          cd deb_working
          
          # 压缩控制信息和程序数据，格式卡死在越狱管理器（Cydia/Sileo/Filza）能识别的旧版 gzip 格式上
          tar -czf ../output_deb/control.tar.gz -C DEBIAN control
          tar -czf ../output_deb/data.tar.gz -C . Applications
          
          cd ../output_deb
          echo "2.0" > debian-binary
          
          # 用 ar 命令把这三个切片封装成一个纯正的标准 .deb 越狱包
          ar -q GuidedCaptureSample.deb debian-binary control.tar.gz data.tar.gz
          
          # 5. 转移结果到项目根目录下，防止打包工具找不到路径
          cd ..
          mkdir -p build
          cp output_deb/GuidedCaptureSample.deb build/GuidedCaptureSample.deb
          echo "✅ DEB package successfully handcrafted at build/GuidedCaptureSample.deb"

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuidedCaptureSample-Unsigned-DEB
          path: build/GuidedCaptureSample.deb
