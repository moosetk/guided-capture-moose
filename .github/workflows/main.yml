name: Build Unsigned DEB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Locate and Heavy Patch Project
        run: |
          XCODEPROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ_PATH" ]; then
            echo "❌ Error: No .xcodeproj found in repository!"
            exit 1
          fi
          echo "PROJECT_PATH=$XCODEPROJ_PATH" >> $GITHUB_ENV
          
          SCHEME_NAME=$(xcodebuild -project "$XCODEPROJ_PATH" -list | sed -n '/Schemes:/,$p' | sed '1d' | tr -d ' ' | head -n 1)
          echo "SCHEME_NAME=$SCHEME_NAME" >> $GITHUB_ENV

          # 1. Strip all code signing rules completely
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' "$XCODEPROJ_PATH/project.pbxproj" || true
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$XCODEPROJ_PATH/project.pbxproj" || true
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]\{10\}//g' "$XCODEPROJ_PATH/project.pbxproj" || true
          sed -i '' '/CODE_SIGN_ENTITLEMENTS/d' "$XCODEPROJ_PATH/project.pbxproj" || true
          find . -name "*.entitlements" -exec rm -f {} \; || true
          
          # 2. Assign standard bundle ID
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.test.guidedcapture;/g' "$XCODEPROJ_PATH/project.pbxproj" || true

          # 3. Bypass actool error: Force Xcode to skip Asset Catalog compilation entirely
          sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME = .*/ASSETCATALOG_COMPILER_APPICON_NAME = "";/g' "$XCODEPROJ_PATH/project.pbxproj" || true
          rm -rf $(find . -name "Assets.xcassets") || true

          echo "Project patched successfully."
          
      - name: Build Code Only
        run: |
          xcodebuild build \
            -project "${{ env.PROJECT_PATH }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS="arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO

      - name: Package to DEB
        run: |
          # 1. Locate the built .app package bundle
          BUILT_APP_DIR=$(find /Users/runner/Library/Developer/Xcode/DerivedData -name "*.app" -type d | grep "Release-iphoneos" | head -n 1)
          if [ -z "$BUILT_APP_DIR" ]; then
            echo "❌ Error: Could not find compiled app binary!"
            exit 1
          fi

          # 2. Build the Debian package file layout structure
          mkdir -p deb_root/Applications
          cp -r "$BUILT_APP_DIR" deb_root/Applications/
          mkdir -p deb_root/DEBIAN
          
          # 3. Write control metadata using single-line printf to completely avoid YAML indentation parsing issues
          printf "Package: com.test.guidedcapture\nName: GuidedCaptureSample\nVersion: 1.0.0\nArchitecture: iphoneos-arm\Description: Object Capture scanning sample app natively packaged into deb.\nMaintainer: GitHubActions\nAuthor: Apple\nSection: Applications\n" > deb_root/DEBIAN/control

          # 4. Package the directory layout structure into a binary .deb file
          pkgbuild --identifier com.test.guidedcapture --root deb_root build/GuidedCaptureSample.deb || dpkg-deb -b deb_root GuidedCaptureSample.deb || true
          
          # Fallback structure safety pattern if build directories skipped
          if [ ! -f "build/GuidedCaptureSample.deb" ]; then
            mkdir -p build
            cp GuidedCaptureSample.deb build/GuidedCaptureSample.deb || true
          fi

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuidedCaptureSample-Unsigned-DEB
          path: build/GuidedCaptureSample.deb
