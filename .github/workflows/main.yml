name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Locate and Heavy Patch Project
        run: |
          XCODEPROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -z "$XCODEPROJ_PATH" ]; then
            echo "❌ 错误：在仓库中未找到任何 .xcodeproj 文件！"
            exit 1
          fi
          echo "PROJECT_PATH=$XCODEPROJ_PATH" >> $GITHUB_ENV
          
          SCHEME_NAME=$(xcodebuild -project "$XCODEPROJ_PATH" -list | sed -n '/Schemes:/,$p' | sed '1d' | tr -d ' ' | head -n 1)
          echo "SCHEME_NAME=$SCHEME_NAME" >> $GITHUB_ENV

          # 1. 彻底移除证书签名约束
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' "$XCODEPROJ_PATH/project.pbxproj" || true
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$XCODEPROJ_PATH/project.pbxproj" || true
          sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]\{10\}//g' "$XCODEPROJ_PATH/project.pbxproj" || true
          
          # 2. 强行卡死设备和架构参数
          sed -i '' 's/TARGETED_DEVICE_FAMILY = .*/TARGETED_DEVICE_FAMILY = "1,2";/g' "$XCODEPROJ_PATH/project.pbxproj" || true
          
          # 3. 强制抹除可能导致不签名中断的配置与 Entitlements
          sed -i '' '/CODE_SIGN_ENTITLEMENTS/d' "$XCODEPROJ_PATH/project.pbxproj" || true
          find . -name "*.entitlements" -exec rm -f {} \; || true
          
          # 4. 覆盖通用测试 ID
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.test.guidedcapture;/g' "$XCODEPROJ_PATH/project.pbxproj" || true

          # 5. 🔥 极限修复：清洗 Assets 内部导致 actool 强寻模拟器的干扰配置
          # 扫描所有 Contents.json，强行移除硬编码指定过低部署目标的 idiomatic 限制或冲突渲染
          find . -name "Contents.json" -exec sed -i '' 's/"idiom" : "universal"/"idiom" : "iphone"/g' {} \; || true
          
          echo "Heavy patch completed."
          
      - name: Build Archive
        run: |
          # 注入 ASSETCATALOG_COMPILER 限制参数，阻止 actool 导出不必要的切片
          xcodebuild archive \
            -project "${{ env.PROJECT_PATH }}" \
            -scheme "${{ env.SCHEME_NAME }}" \
            -configuration Release \
            -archivePath build/Output.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS="arm64" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            ASSETCATALOG_COMPILER_FLAGS="--target-device iphone --target-device ipad"

      - name: Package to Unsigned IPA
        if: success()
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Output.xcarchive/Products/Applications -name "*.app" | head -n 1)
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r GuidedCaptureSample_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GuidedCaptureSample-Unsigned-IPA
          path: build/GuidedCaptureSample_Unsigned.ipa
